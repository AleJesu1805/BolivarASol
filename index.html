<!DOCTYPE html>
<html lang="es" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="mannifest" href="manifest.json">

<body>
    <div class="container-monedas">
        <div class="inputs">
            <input type="text" class="input" id="dolar" value="1" inputmode="decimal" pattern="[0-9]">
            <input type="text" class="input" id="bolivar" value="0" inputmode="decimal" pattern="[0-9]">
            <input type="text" class="input" id="sol" value="0" inputmode="decimal" pattern="[0-9]">
        </div>
        <div class="monedas">
            <span class="moneda">USDT</span>
            <span class="moneda">BCV</span>
            <span class="moneda">PEN</span>
        </div>
    </div>
    <div class="container-atajos">
        <div id="contenedorScroll">
        </div>
    </div>
