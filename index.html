<head>

    <title>CONVERSION-MONEDA</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

        <tr class="filas">
            <th>DOLARES</th>
            <th>BOLIVARES</th>
            <th>SOLES</th>
        </tr>
        <tr class="filas">
            <td><input type="number" class="input" id="dolar" value="1"></td>
            <td><input type="number" class="input" id="bolivar" value="0"></td>
            <td><input type="number" class="input" id="sol" value="0"></td>
        </tr>
    </table>
    <h3>HISTORIAL</h3>
    <table class="tabla" id="valoresAnteriores">
        <tr class="filas">
            <th>DOLAR</th>
            <th>BOLIVAR</th>
            <th>SOL</th>
        </tr>
        <tr class="filas">
            <td>1</td>
            <td>0</td>
            <td>0</td>
        </tr>
    </table>
    <script src="script.js"></script>
</body>

</html>
